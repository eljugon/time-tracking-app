<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>Rail — Time Tracking</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#10141A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rail">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141A;
    --surface:#1A2029;
    --surface-2:#222A35;
    --border:#2C3745;
    --text:#EEF2F6;
    --text-dim:#8996A6;
    --text-faint:#586372;
    --amber:#F5A623;
    --amber-dim:#4A3A1C;
    --blue:#5B9BEF;
    --blue-dim:#1E2E45;
    --violet:#9E8CF5;
    --violet-dim:#2A2440;
    --green:#4FD1A5;
    --red:#F0665A;
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px) 0;}
  .app{max-width:460px; margin:0 auto; padding:20px 18px 0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* ---------- header ---------- */
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .greet{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600;}
  .greet .date{display:block; font-family:'Inter'; font-size:12.5px; font-weight:500; color:var(--text-dim); margin-top:2px; text-transform:capitalize;}
  .sync-dot{width:9px; height:9px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
  .sync-dot.ok{background:var(--green); box-shadow:0 0 8px var(--green);}
  .sync-dot.pending{background:var(--amber);}
  .sync-dot.err{background:var(--red);}
  .top-actions{display:flex; align-items:center; gap:14px;}
  .icon-btn{width:34px; height:34px; border-radius:10px; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;}

  /* ---------- day rail (signature element) ---------- */
  .rail-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 16px 14px; margin-bottom:14px;}
  .rail-label{display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); margin-bottom:8px; letter-spacing:.04em;}
  .rail-track{position:relative; height:34px; background:var(--surface-2); border-radius:8px; overflow:hidden;}
  .rail-seg{position:absolute; top:0; bottom:0; border-radius:4px;}
  .rail-seg.work{background:linear-gradient(90deg,var(--amber),#ffcf7a);}
  .rail-seg.break{background:var(--violet-dim); border:1px dashed var(--violet);}
  .rail-now{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--text); box-shadow:0 0 6px rgba(255,255,255,.6);}
  .rail-ticks{display:flex; justify-content:space-between; margin-top:6px; font-size:10px; color:var(--text-faint);}

  /* ---------- status card ---------- */
  .status-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:14px;}
  .status-eyebrow{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .status-headline{font-family:'Space Grotesk'; font-size:22px; font-weight:600; line-height:1.25; margin-bottom:2px;}
  .status-sub{font-size:13.5px; color:var(--text-dim); margin-bottom:16px;}
  .status-sub .mono{color:var(--text);}
  .timer{font-family:'JetBrains Mono'; font-size:15px; color:var(--amber);}

  .btn-row{display:flex; gap:10px;}
  .btn{flex:1; border:none; border-radius:var(--radius-sm); padding:15px 14px; font-family:'Inter'; font-weight:600; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--amber); color:#1A1200;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}
  .btn-danger-ghost{background:transparent; color:var(--red); border:1px solid rgba(240,102,90,.35);}
  .btn-full{width:100%;}
  .btn-sm{padding:10px 12px; font-size:13px; border-radius:10px;}

  /* ---------- location grid ---------- */
  .site-title{font-size:13.5px; color:var(--text-dim); margin:2px 0 12px;}
  .site-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .site-chip{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px 12px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; cursor:pointer; text-align:left;}
  .site-chip:active{transform:scale(.97);}
  .site-chip .swatch{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center;}
  .site-chip .name{font-weight:600; font-size:14px;}
  .site-chip .sub{font-size:11px; color:var(--text-faint);}
  .swatch svg{width:15px; height:15px;}

  /* ---------- history ---------- */
  .section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; cursor:pointer;}
  .section-title h3{font-family:'Space Grotesk'; font-size:14.5px; font-weight:600; margin:0; color:var(--text-dim); letter-spacing:.02em;}
  .chevron{transition:transform .2s ease; color:var(--text-faint);}
  .chevron.open{transform:rotate(180deg);}
  .hist-row{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
  .hist-row:active{background:var(--surface-2);}
  .hist-row:last-child{border-bottom:none;}
  .hist-date{font-size:13px; font-weight:600; width:64px; flex-shrink:0;}
  .hist-date .dow{display:block; font-size:10.5px; color:var(--text-faint); font-weight:500; text-transform:capitalize;}
  .hist-mid{flex:1; font-size:12.5px; color:var(--text-dim);}
  .hist-loc{display:inline-flex; align-items:center; gap:5px; font-weight:500; color:var(--text);}
  .hist-loc .dot{width:7px; height:7px; border-radius:50%;}
  .hist-hours{font-family:'JetBrains Mono'; font-size:13px; text-align:right;}
  .hist-hours .ot{display:block; font-size:10.5px; color:var(--amber); margin-top:2px;}

  /* ---------- settings ---------- */
  .settings-body{display:none;}
  .settings-body.open{display:block;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  .field input[type=text], .field input[type=password], .field input[type=time]{width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:14px; font-family:'JetBrains Mono';}
  .field input[type=text], .field input[type=password]{font-family:'Inter';}
  .field select{width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:14px; font-family:'Inter'; appearance:none; -webkit-appearance:none;}
  .add-past-row{display:flex; align-items:center; justify-content:space-between; padding:0 4px 14px;}
  .add-past-row span{font-size:12.5px; color:var(--text-dim);}
  .add-past-row input[type=date]{background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 10px; font-family:'JetBrains Mono'; font-size:12.5px;}
  .stamp-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .stamp-row input[type=time]{width:98px; flex-shrink:0; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:0 6px; height:48px; font-family:'JetBrains Mono'; font-size:14px; text-align:center;}
  .stamp-row .btn{flex:1; margin:0;}
  .mini-label{font-size:12px; color:var(--text-dim); margin:14px 0 6px;}
  .break-row{display:flex; align-items:center; gap:8px;}
  .break-row input[type=time]{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:0 4px; height:48px; font-family:'JetBrains Mono'; font-size:13.5px; text-align:center;}
  .break-row .arrow{color:var(--text-faint); font-size:14px; flex-shrink:0;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
  .toggle-row span{font-size:13.5px;}
  .switch{position:relative; width:42px; height:24px; background:var(--surface-2); border:1px solid var(--border); border-radius:20px; cursor:pointer; flex-shrink:0;}
  .switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--text-faint); transition:.2s ease;}
  .switch.on{background:var(--amber-dim); border-color:var(--amber);}
  .switch.on .knob{left:20px; background:var(--amber);}
  .hint{font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-top:4px;}
  .sync-log{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--text-faint); margin-top:10px; white-space:pre-wrap; line-height:1.6;}

  /* ---------- toast / overlay ---------- */
  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:12px 18px; border-radius:12px; font-size:13.5px; display:flex; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast button{background:none; border:none; color:var(--amber); font-weight:600; font-size:13px; cursor:pointer;}

  .expand{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .expand.open{max-height:400px;}
  .more-toggle{font-size:12px; color:var(--text-dim); text-align:center; padding:10px 0 2px; cursor:pointer;}

  ::selection{background:var(--amber-dim);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= STORAGE BRIDGE =================
   En la app de escritorio, electron/preload.cjs define window.storage
   (respaldado por un fichero JSON en la carpeta de datos del usuario).
   Si el HTML se abre suelto en un navegador, caemos a localStorage. */
if(!window.storage){
  window.storage = {
    async get(key){
      const v = localStorage.getItem('rail:'+key);
      return v===null ? null : { value: v };
    },
    async set(key, value){ localStorage.setItem('rail:'+key, value); return true; }
  };
}
</script>
<script>
/* ================= DATA LAYER ================= */
const SITES = [
  { key:'home',      name:'Home / Remoto',        sub:'Home/Remote',   color:'var(--blue)',   workLocation:'Home/Remote',        campus:'Home/Remote',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>' },
  { key:'stockholm', name:'Estocolmo',             sub:'Regeringsgatan',color:'var(--blue)',   workLocation:'Stockholm',          campus:'Regeringsgatan',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/></svg>' },
  { key:'ersbo',     name:'Ersbo',                 sub:'Construction site', color:'var(--amber)', workLocation:'Gävle',           campus:'Ersbo',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V9l8-5 8 5v12"/><path d="M4 21h16M9 21v-6h6v6"/></svg>' },
  { key:'tuna',      name:'Tuna',                  sub:'Construction site', color:'var(--amber)', workLocation:'Gävle',           campus:'Tuna',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V9l8-5 8 5v12"/><path d="M4 21h16M9 21v-6h6v6"/></svg>' },
  { key:'stackbo',   name:'Stackbo',               sub:'Construction site', color:'var(--amber)', workLocation:'Gävle',           campus:'Stackbo',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V9l8-5 8 5v12"/><path d="M4 21h16M9 21v-6h6v6"/></svg>' },
  { key:'other',     name:'Otra oficina MSFT',     sub:'p.ej. Dublin',   color:'var(--violet)', workLocation:'Other MSFT location', campus:'Dublin',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 16l20-8-8 20-2-8-8-4z"/></svg>' },
];
const siteByKey = k => SITES.find(s=>s.key===k);

let STATE = { entries:{}, settings:{ regulatedHours:'07:45', oneDrivePath:'', notifDevice:false, lastSite:'home', apiKey:'', mcpToken:'', serverUrl:'', serverToken:'' } };
let ui = { historyOpen:false, settingsOpen:false, moreOpen:false, editingDate:null };
let pending = { entryTime:null, exitTime:null, breakStart:null, breakEnd:null, breakEndTouched:false }; // user-edited, unconfirmed times

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function minsBetween(a,b){ const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number); return (bh*60+bm)-(ah*60+am); }
function hm(mins){ const s=mins<0?'-':''; mins=Math.abs(mins); return s+Math.floor(mins/60)+'h '+String(mins%60).padStart(2,'0')+'m'; }
function dowShort(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short'}); }
function dateLabel(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}); }
function regulatedMins(){ const [h,m]=STATE.settings.regulatedHours.split(':').map(Number); return h*60+m; }
function timeValue(field){ return pending[field] || nowHM(); }

/* ================= BACKEND OPCIONAL =================
   Si hay servidor configurado, los registros viven ahí y todos los dispositivos
   ven lo mismo. Si no, cada dispositivo guarda los suyos y nada cambia.
   Ajustes compartidos: ruta del Excel y horas reguladas. El resto (URL, tokens,
   avisos) es de cada dispositivo. */
const SHARED_SETTINGS = ['oneDrivePath','regulatedHours'];

let remoteReady = false;   // ¿hemos leído ya del servidor en esta sesión?

function remoteOn(){ return !!(STATE.settings.serverUrl && STATE.settings.serverToken); }

async function api(method, path, body){
  const base = STATE.settings.serverUrl.replace(/\/+$/,'');
  const res = await fetch(base+'/api/'+path, {
    method,
    headers: Object.assign(
      { 'Authorization':'Bearer '+STATE.settings.serverToken },
      body ? { 'Content-Type':'application/json' } : {}
    ),
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try{ data = await res.json(); }catch(err){ /* respuesta sin cuerpo */ }
  if(!res.ok) throw new Error(data.error || ('HTTP '+res.status));
  return data;
}

/* Cola de días pendientes de subir, para poder fichar sin cobertura. */
function outboxGet(){ try{ return JSON.parse(localStorage.getItem('rail:outbox')||'[]'); }catch(err){ return []; } }
function outboxSet(list){ localStorage.setItem('rail:outbox', JSON.stringify(Array.from(new Set(list)))); }

async function flushOutbox(){
  if(!remoteOn()) return;
  const pending = outboxGet();
  if(!pending.length) return;
  const failed = [];
  for(const iso of pending){
    const entry = STATE.entries[iso];
    if(!entry) continue;
    try{ await api('PUT','entries/'+iso, entry); }
    catch(err){ failed.push(iso); }
  }
  outboxSet(failed);
  setSyncStatus(failed.length ? 'pending' : 'ok');
}

/* Guardar un día: siempre en local (sirve de caché) y, si hay servidor, allí. */
async function persist(iso){
  await saveEntries();
  if(!remoteOn()) return;
  try{
    await api('PUT','entries/'+iso, STATE.entries[iso]);
    await flushOutbox();
  }catch(err){
    outboxSet(outboxGet().concat([iso]));
    setSyncStatus('pending');
  }
}

async function persistDelete(iso){
  await saveEntries();
  if(!remoteOn()) return;
  try{ await api('DELETE','entries/'+iso); }
  catch(err){ /* al recargar se vuelve a leer del servidor */ }
}

async function loadState(){
  try{
    const e = await window.storage.get('entries', false);
    if(e) STATE.entries = JSON.parse(e.value);
  }catch(err){ /* no entries yet */ }
  try{
    const s = await window.storage.get('settings', false);
    if(s) STATE.settings = {...STATE.settings, ...JSON.parse(s.value)};
  }catch(err){ /* no settings yet */ }

  if(remoteOn()){
    try{
      const [remoteEntries, remoteSettings] = await Promise.all([
        api('GET','entries'), api('GET','settings')
      ]);
      STATE.entries = remoteEntries.entries || {};
      if(remoteSettings.settings) STATE.settings = {...STATE.settings, ...remoteSettings.settings};
      remoteReady = true;
      await saveEntries();
      await flushOutbox();
    }catch(err){
      // Sin conexión seguimos con la última copia local.
      setSyncStatus('pending');
    }
  }
}
async function saveEntries(){
  try{ await window.storage.set('entries', JSON.stringify(STATE.entries), false); }
  catch(err){ showToast('No se pudo guardar. Reintenta.'); }
}
async function saveSettings(){
  try{ await window.storage.set('settings', JSON.stringify(STATE.settings), false); }
  catch(err){ showToast('No se pudo guardar la configuración.'); }
  if(remoteOn() && remoteReady){
    const shared = {};
    SHARED_SETTINGS.forEach(k => shared[k] = STATE.settings[k]);
    try{ await api('PUT','settings', shared); }
    catch(err){ /* se reintenta al volver a guardar */ }
  }
}

function entryFor(iso){
  if(!STATE.entries[iso]) STATE.entries[iso] = { date: iso, entryTime:null, exitTime:null, breakStart:null, breakEnd:null, breakMins:0,
    site: STATE.settings.lastSite || 'home', vacation:false, commuteMins:0, notes:'', synced:false };
  return STATE.entries[iso];
}
function todayEntry(){ return entryFor(todayISO()); }
function addMinutes(hhmm, mins){
  const [h,m] = hhmm.split(':').map(Number);
  let total = ((h*60+m+mins)%1440+1440)%1440;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function breakStartVal(e){ return pending.breakStart!=null ? pending.breakStart : (e.breakStart || nowHM()); }
function breakEndVal(e){
  if(pending.breakEndTouched) return pending.breakEnd;
  if(pending.breakStart==null && e.breakEnd) return e.breakEnd;
  return addMinutes(breakStartVal(e), 15);
}

/* ================= ACTIONS ================= */
async function startDay(siteKey){
  const e = todayEntry();
  e.entryTime = timeValue('entryTime');
  e.site = siteKey;
  STATE.settings.lastSite = siteKey;
  e.synced = false;
  pending.entryTime = null;
  await persist(todayISO()); await saveSettings();
  render();
  showToast('Día iniciado a las '+e.entryTime, ()=>{ e.entryTime=null; persist(todayISO()); render(); });
}
async function logBreak(){
  const e = todayEntry();
  const start = breakStartVal(e), end = breakEndVal(e);
  e.breakStart = start; e.breakEnd = end;
  e.breakMins = Math.max(0, minsBetween(start, end));
  e.synced = false;
  pending.breakStart = null; pending.breakEnd = null; pending.breakEndTouched = false;
  await persist(todayISO()); render();
  showToast('Pausa registrada: '+start+' – '+end);
}
async function endDay(){
  const e = todayEntry(); e.exitTime = timeValue('exitTime'); e.synced=false;
  pending.exitTime = null;
  await persist(todayISO()); render();
  showToast('Día terminado a las '+e.exitTime, ()=>{ e.exitTime=null; persist(todayISO()); render(); });
}
async function updateField(iso, field, value){
  const e = STATE.entries[iso]; if(!e) return;
  e[field] = value; e.synced=false;
  await persist(iso); render();
}
async function updateBreakTime(iso, field, value){
  const e = STATE.entries[iso]; if(!e) return;
  e[field] = value;
  if(e.breakStart && e.breakEnd) e.breakMins = Math.max(0, minsBetween(e.breakStart, e.breakEnd));
  e.synced=false;
  await persist(iso); render();
}

/* ================= SYNC (Microsoft 365 → OneDrive Excel) ================= */
async function syncEntry(iso){
  const e = STATE.entries[iso];
  if(!e || !e.entryTime){ showToast('Nada que sincronizar ese día.'); return; }
  if(!STATE.settings.oneDrivePath){ ui.settingsOpen=true; render(); showToast('Indica primero la ruta del Excel en OneDrive.'); return; }
  setSyncStatus('pending');
  const site = siteByKey(e.site) || SITES[0];
  const totalBreak = e.breakMins;
  const prompt = `Add one new row to the Excel table on the "Timesheet" sheet (the table is named Table15) inside the OneDrive Excel file located at: "${STATE.settings.oneDrivePath}" (this may be a file path or a OneDrive sharing link — resolve it to the actual file first).
Columns in order are: Date | Day of Week | Entry Time | Exit Time | Break Duration (hh:mm) | Vacation Day / Weekend / National Holiday | Work location | Campus/Office | Commute/Travel Time (hh:mm) | Regular Hours Worked | Overtime (hh:mm) | Notes.
"Day of Week", "Regular Hours Worked" and "Overtime (hh:mm)" are calculated columns with a formula already applied down the whole table — do NOT write literal values into those three columns, only write into the other columns and let the table's existing formulas auto-fill them (Excel tables auto-extend calculated-column formulas to new rows).
If a row for date ${iso} already exists in the table, update that row instead of adding a duplicate.
Values to write:
Date: ${iso}
Entry Time: ${e.entryTime}
Exit Time: ${e.exitTime || ''}
Break Duration (hh:mm): ${toHHMM(totalBreak)}
Vacation Day / Weekend / National Holiday: ${e.vacation ? 'YES' : 'NO'}
Work location: ${site.workLocation}
Campus/Office: ${site.campus}
Commute/Travel Time (hh:mm): ${toHHMM(e.commuteMins||0)}
Notes: ${e.notes || ''}
Reply with a single short confirmation line once the row has been written.`;

  try{
    // Tres caminos, por orden: el backend (guarda la clave por nosotros), el
    // proceso principal de Electron, o nada. Desde una página suelta no se puede:
    // haría falta poner la clave dentro del navegador.
    let out;
    if(remoteOn()){
      await persist(iso);                    // el servidor sincroniza lo que tiene guardado
      out = await api('POST','sync',{ date: iso });
    }else if(window.rail && window.rail.sync){
      if(!STATE.settings.apiKey){
        ui.settingsOpen = true; render();
        throw new Error('Falta la clave de API de Anthropic en Configuración.');
      }
      out = await window.rail.sync({
        prompt,
        apiKey: STATE.settings.apiKey,
        mcpToken: STATE.settings.mcpToken || ''
      });
      if(!out.ok){ throw new Error(out.error || 'Error de sincronización'); }
    }else{
      throw new Error('Configura el servidor en Ajustes o usa la app de escritorio.');
    }
    e.synced = true; await persist(iso);
    setSyncStatus('ok');
    logSync(iso+' → '+((out.text||'sincronizado').trim().slice(0,70)));
    render();
  }catch(err){
    setSyncStatus('err');
    const msg = (err.message||'desconocido').slice(0,120);
    logSync(iso+' → error: '+msg);
    showToast('No se pudo sincronizar: '+msg);
  }
}
function toHHMM(mins){ mins=Math.max(0,Math.round(mins)); return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'); }
function setSyncStatus(s){ const dot=document.getElementById('syncDot'); if(dot){ dot.className='sync-dot '+s; } }
function logSync(line){ const el=document.getElementById('syncLog'); if(el){ el.textContent = (line+'\n'+el.textContent).split('\n').slice(0,6).join('\n'); } }

/* ================= NOTIFICATIONS (best-effort, tab must be open) ================= */
let firedToday = {};
function checkDeviceReminders(){
  if(!STATE.settings.notifDevice || Notification.permission!=='granted') return;
  const t = nowHM(); const iso = todayISO();
  firedToday[iso] = firedToday[iso] || {};
  const map = {'09:00':'¿A qué hora has empezado a trabajar? ¿Y desde dónde?', '12:00':'¿Vas a hacer pausa hoy? Regístrala en Rail.', '16:00':'¿A qué hora terminas hoy?'};
  if(map[t] && !firedToday[iso][t]){
    firedToday[iso][t]=true;
    new Notification('Rail — time tracking', { body: map[t] });
  }
}
setInterval(checkDeviceReminders, 30000);

/* ================= UI HELPERS ================= */
let toastTimer;
function showToast(msg, undoFn){
  const t = document.getElementById('toast');
  t.innerHTML = msg + (undoFn ? ' <button id="undoBtn">Deshacer</button>' : '');
  t.classList.add('show');
  if(undoFn) document.getElementById('undoBtn').onclick = ()=>{ undoFn(); t.classList.remove('show'); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 4000);
}

function dayPhase(e){
  if(!e.entryTime) return 'not-started';
  if(!e.exitTime) return 'working';
  return 'done';
}

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  const iso = todayISO();
  const e = todayEntry();
  const phase = dayPhase(e);
  const site = siteByKey(e.site) || SITES[0];

  const dateStr = new Date().toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'});

  let statusHTML = '';
  if(phase==='not-started'){
    statusHTML = `
      <div class="status-card">
        <div class="status-eyebrow">Empezar el día</div>
        <div class="status-headline">¿Dónde trabajas hoy?</div>
        <div class="field">
          <label>Hora de entrada</label>
          <input type="time" value="${timeValue('entryTime')}" oninput="pending.entryTime=this.value">
        </div>
        <div class="site-grid">${SITES.map(s=>siteChip(s)).join('')}</div>
      </div>`;
  } else if(phase==='working'){
    const bStart = breakStartVal(e), bEnd = breakEndVal(e);
    const bMins = Math.max(0, minsBetween(bStart, bEnd));
    statusHTML = `
      <div class="status-card">
        <div class="status-eyebrow"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${site.color};display:inline-block"></span> Trabajando · ${site.name}</div>
        <div class="status-headline">Desde las <span class="mono">${e.entryTime}</span></div>
        <div class="status-sub timer" id="liveTimer"></div>

        <div class="mini-label">Pausa ${e.breakStart?'(toca para ajustar)':`· ${bMins} min por defecto`}</div>
        <div class="break-row">
          <input type="time" value="${bStart}" onchange="pending.breakStart=this.value; render();">
          <span class="arrow">→</span>
          <input type="time" value="${bEnd}" onchange="pending.breakEnd=this.value; pending.breakEndTouched=true; render();">
        </div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn btn-secondary" onclick="logBreak()">${e.breakStart?'Actualizar pausa':'Registrar pausa'} · ${bMins}m</button>
        </div>

        <div class="stamp-row">
          <input type="time" value="${timeValue('exitTime')}" oninput="pending.exitTime=this.value">
          <button class="btn btn-primary" onclick="endDay()">Terminar día</button>
        </div>
      </div>`;
  } else {
    const totalBreak = e.breakMins;
    const worked = minsBetween(e.entryTime, e.exitTime) - totalBreak;
    const ot = worked - regulatedMins();
    statusHTML = `
      <div class="status-card">
        <div class="status-eyebrow"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block"></span> Día terminado · ${site.name}</div>
        <div class="status-headline mono">${hm(worked)}</div>
        <div class="status-sub">${e.entryTime} – ${e.exitTime} &nbsp;·&nbsp; pausa ${toHHMM(totalBreak)} ${ot>0?`&nbsp;·&nbsp; <span style="color:var(--amber)">+${hm(ot)} extra</span>`:''}</div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="openDayEditor('${iso}')">Editar</button>
          <button class="btn btn-secondary" onclick="syncEntry('${iso}')">${e.synced?'✓ Sincronizado':'Enviar a Excel'}</button>
        </div>
      </div>`;
  }

  const entries = Object.values(STATE.entries).sort((a,b)=> b.date.localeCompare(a.date)).slice(0,10);
  const histHTML = entries.map(en=>{
    const s = siteByKey(en.site)||SITES[0];
    const worked = (en.entryTime && en.exitTime) ? minsBetween(en.entryTime, en.exitTime) - (en.breakMins||0) : null;
    const ot = worked!=null ? worked - regulatedMins() : null;
    return `<div class="hist-row" onclick="openDayEditor('${en.date}')">
      <div class="hist-date">${dateLabel(en.date)}<span class="dow">${dowShort(en.date)}</span></div>
      <div class="hist-mid">
        <span class="hist-loc"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.name}</span><br>
        <span class="mono">${en.entryTime||'—'} – ${en.exitTime||'—'}</span>
      </div>
      <div class="hist-hours">${worked!=null?hm(worked):'—'}${ot>0?`<span class="ot">+${hm(ot)}</span>`:''}</div>
    </div>`;
  }).join('') || `<div class="hint">Aún no hay días registrados.</div>`;

  app.innerHTML = `
    <header>
      <div class="greet">Hola, Alvaro<span class="date">${dateStr}</span></div>
      <div class="top-actions">
        <div class="icon-btn" onclick="toggleSettings()" title="Configuración">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </div>
        <div class="sync-dot ${e.synced?'ok':''}" id="syncDot" title="Estado de sincronización"></div>
      </div>
    </header>

    ${railHTML(e, phase)}
    ${statusHTML}
    ${ui.editingDate ? dayEditorBlock(ui.editingDate) : ''}

    <div class="section-title" onclick="toggleHistory()">
      <h3>Historial</h3>
      <svg class="chevron ${ui.historyOpen?'open':''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="add-past-row">
      <span>Registrar un día anterior</span>
      <input type="date" max="${todayISO()}" value="" onchange="if(this.value){ openDayEditor(this.value); this.value=''; }">
    </div>
    <div class="expand ${ui.historyOpen?'open':''}" style="max-height:${ui.historyOpen?'1200px':'0'}">
      <div class="status-card" style="padding:6px 14px;">${histHTML}</div>
    </div>

    <div class="section-title" onclick="toggleSettings()">
      <h3>Configuración y sincronización</h3>
      <svg class="chevron ${ui.settingsOpen?'open':''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="settings-body ${ui.settingsOpen?'open':''}">
      <div class="status-card">
        <div class="field">
          <label>Archivo Excel en OneDrive (ruta o enlace)</label>
          <input type="text" id="pathInput" placeholder="/Documents/archivo.xlsx  o  https://1drv.ms/..." value="${STATE.settings.oneDrivePath}">
        </div>
        <div class="field">
          <label>Horas reguladas por día</label>
          <input type="text" id="regInput" value="${STATE.settings.regulatedHours}" placeholder="07:45">
        </div>
        <div class="field">
          <label>URL del servidor (opcional)</label>
          <input type="text" id="srvInput" placeholder="https://rail-timesheet.tu-cuenta.workers.dev" value="${STATE.settings.serverUrl||''}">
        </div>
        <div class="field">
          <label>Token de acceso al servidor</label>
          <input type="password" id="srvTokenInput" placeholder="El mismo RAIL_ACCESS_TOKEN del Worker" value="${STATE.settings.serverToken||''}">
        </div>
        <div class="hint">${remoteOn()
          ? 'Servidor activo: los registros se comparten entre tus dispositivos y «Enviar a Excel» funciona también desde el móvil.'
          : 'Sin servidor: los registros se quedan en este dispositivo y solo la app de escritorio escribe en el Excel.'}</div>
        <div class="field" style="margin-top:12px">
          <label>Clave de API de Anthropic (solo app de escritorio sin servidor)</label>
          <input type="password" id="keyInput" placeholder="sk-ant-..." value="${STATE.settings.apiKey||''}">
        </div>
        <div class="field">
          <label>Token del conector Microsoft 365 (solo app de escritorio sin servidor)</label>
          <input type="password" id="mcpInput" placeholder="Token OAuth del MCP de Microsoft 365" value="${STATE.settings.mcpToken||''}">
        </div>
        <div class="hint">Con servidor configurado estas dos casillas sobran: las claves viven como secretos del Worker. Sin él, se guardan sin cifrar en este dispositivo.</div>
        <div class="toggle-row">
          <span>Avisos en este dispositivo (mientras la app esté abierta)</span>
          <div class="switch ${STATE.settings.notifDevice?'on':''}" onclick="toggleNotif()"><div class="knob"></div></div>
        </div>
        <div class="hint">Estos avisos solo funcionan con la pestaña abierta. Para avisos fiables a las 9:00 / 12:00 / 16:00 en el móvil y el portátil, usa recordatorios recurrentes en tu calendario de Outlook — puedo crearlos si me lo pides en el chat.</div>
        <button class="btn btn-secondary btn-full btn-sm" style="margin-top:14px" onclick="saveSettingsFromUI()">Guardar configuración</button>
        <div class="sync-log" id="syncLog"></div>
      </div>
    </div>
  `;

  if(phase==='working') startLiveTimer(e.entryTime);
}

function railHTML(e, phase){
  const startH=6, endH=20, span=(endH-startH)*60;
  const pct = (hm)=> { if(!hm) return null; const [h,m]=hm.split(':').map(Number); return Math.max(0,Math.min(100, ((h*60+m)-startH*60)/span*100)); };
  let segs='';
  if(e.entryTime){
    const entryP = pct(e.entryTime);
    const exitP = pct(e.exitTime) ?? pct(nowHM());
    segs += `<div class="rail-seg work" style="left:${entryP}%; width:${Math.max(0.5,exitP-entryP)}%"></div>`;
  }
  if(e.breakStart){
    const bs = pct(e.breakStart), be = pct(e.breakEnd) ?? pct(nowHM());
    segs += `<div class="rail-seg break" style="left:${bs}%; width:${Math.max(0.5,be-bs)}%"></div>`;
  }
  const nowP = pct(nowHM());
  const nowLine = (phase==='working') ? `<div class="rail-now" style="left:${nowP}%"></div>` : '';
  return `
    <div class="rail-card">
      <div class="rail-label"><span>JORNADA</span><span>06 – 20h</span></div>
      <div class="rail-track">${segs}${nowLine}</div>
      <div class="rail-ticks"><span>06</span><span>09</span><span>12</span><span>16</span><span>20</span></div>
    </div>`;
}

function siteChip(s){
  return `<div class="site-chip" onclick="startDay('${s.key}')">
    <div class="swatch" style="background:${s.color}22; color:${s.color}">${s.icon}</div>
    <div><div class="name">${s.name}</div><div class="sub">${s.sub}</div></div>
  </div>`;
}

function dayEditorBlock(iso){
  const e = entryFor(iso);
  return `
    <div class="status-card" id="dayEditor">
      <div class="status-eyebrow">Editar día · ${dateLabel(iso)} <span style="text-transform:capitalize">(${dowShort(iso)})</span></div>
      <div class="field"><label>Sitio</label>
        <select onchange="updateField('${iso}','site',this.value)">
          ${SITES.map(s=>`<option value="${s.key}" ${s.key===e.site?'selected':''}>${s.name}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Entrada</label><input type="time" value="${e.entryTime||''}" onchange="updateField('${iso}','entryTime',this.value)"></div>
      <div class="field"><label>Salida</label><input type="time" value="${e.exitTime||''}" onchange="updateField('${iso}','exitTime',this.value)"></div>
      <div class="field"><label>Inicio de pausa</label><input type="time" value="${e.breakStart||''}" onchange="updateBreakTime('${iso}','breakStart',this.value)"></div>
      <div class="field"><label>Fin de pausa</label><input type="time" value="${e.breakEnd||''}" onchange="updateBreakTime('${iso}','breakEnd',this.value)"></div>
      <div class="hint" style="margin:-6px 0 12px">Pausa total: ${toHHMM(e.breakMins)}</div>
      <div class="field"><label>Notas</label><input type="text" value="${e.notes||''}" placeholder="Opcional" onchange="updateField('${iso}','notes',this.value)"></div>
      <div class="toggle-row"><span>Vacaciones / festivo</span><div class="switch ${e.vacation?'on':''}" onclick="updateField('${iso}','vacation', ${!e.vacation})"><div class="knob"></div></div></div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn btn-ghost" onclick="closeDayEditor()">Cerrar</button>
        <button class="btn btn-secondary" onclick="syncEntry('${iso}')">${e.synced?'✓ Sincronizado':'Enviar a Excel'}</button>
      </div>
    </div>`;
}
function openDayEditor(iso){ entryFor(iso); ui.editingDate = iso; render(); }
function closeDayEditor(){
  const iso = ui.editingDate;
  if(iso){
    const e = STATE.entries[iso];
    if(e && !e.entryTime && !e.exitTime && !e.breakStart && !e.notes && !e.vacation){ delete STATE.entries[iso]; persistDelete(iso); }
  }
  ui.editingDate = null; render();
}
function toggleHistory(){ ui.historyOpen=!ui.historyOpen; render(); }
function toggleSettings(){ ui.settingsOpen=!ui.settingsOpen; render(); }
async function toggleNotif(){
  if(!STATE.settings.notifDevice){
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ showToast('Permiso de notificaciones denegado.'); return; }
  }
  STATE.settings.notifDevice = !STATE.settings.notifDevice;
  await saveSettings(); render();
}
async function saveSettingsFromUI(){
  const previo = {...STATE.settings};
  STATE.settings.oneDrivePath = document.getElementById('pathInput').value.trim();
  STATE.settings.regulatedHours = document.getElementById('regInput').value.trim() || '07:45';
  STATE.settings.apiKey = document.getElementById('keyInput').value.trim();
  STATE.settings.mcpToken = document.getElementById('mcpInput').value.trim();
  STATE.settings.serverUrl = document.getElementById('srvInput').value.trim();
  STATE.settings.serverToken = document.getElementById('srvTokenInput').value.trim();

  if(remoteOn()){
    try{
      const [rs, re] = await Promise.all([api('GET','settings'), api('GET','entries')]);
      const shared = rs.settings || {};
      // Lo que el usuario acaba de cambiar manda; lo que no ha tocado, lo dicta
      // el servidor. Así un dispositivo nuevo no pisa la configuración común.
      SHARED_SETTINGS.forEach(k => {
        if(STATE.settings[k] === previo[k] && shared[k]) STATE.settings[k] = shared[k];
      });
      STATE.entries = re.entries || {};
      remoteReady = true;
      await saveSettings();
      await saveEntries();
      await flushOutbox();
      setSyncStatus('ok');
      showToast('Conectado al servidor.');
      render();
      return;
    }catch(err){
      remoteReady = false;
      await saveSettings();
      setSyncStatus('err');
      showToast('No se pudo conectar: '+(err.message||'').slice(0,60));
      render();
      return;
    }
  }
  await saveSettings();
  showToast('Configuración guardada.');
}

let liveTimerInt;
function startLiveTimer(since){
  clearInterval(liveTimerInt);
  const tick = ()=>{
    const el = document.getElementById('liveTimer');
    if(!el){ clearInterval(liveTimerInt); return; }
    el.textContent = hm(Math.max(0, minsBetween(since, nowHM()))) + ' transcurridas';
  };
  tick(); liveTimerInt = setInterval(tick, 15000);
}

window.addEventListener('online', ()=>{ flushOutbox().then(render); });

/* ================= PWA ================= */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* sin modo offline */ });
  });
}

/* ================= INIT ================= */
(async function init(){
  await loadState();
  render();
  setInterval(render, 60000);
})();
</script>
</body>
</html>
